<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWay</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="auth-container">
        <!-- Login Form -->
        <div id="login-form">
            <h1>Login to ChatWay</h1>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button>Login</button>
            <p>Don't have an account? <a href="#" id="show-register">Register</a></p>
        </div>

        <!-- Registration Form -->
        <div id="register-form" style="display: none;">
            <h1>Register for ChatWay</h1>
            <input type="text" placeholder="Name" required>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <input type="password" placeholder="Confirm Password" required>
            <input type="date" placeholder="Date of Birth" required>
            <select required>
                <option value="" disabled selected>Select Sex</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <input type="text" placeholder="Country" required>
            <input type="text" placeholder="Language" required>
            <button>Register</button>
            <p>Already have an account? <a href="#" id="show-login">Login</a></p>
        </div>
    </div>

    <div id="app-container" style="display: none;">
        <nav>
            <a href="#" class="nav-link active" data-target="mundo">Mundo</a>
            <a href="#" class="nav-link" data-target="chat">Chat</a>
            <a href="#" class="nav-link" data-target="hacer-amigos">Hacer Amigos</a>
            <a href="#" class="nav-link" data-target="juego">Juego</a>
        </nav>
        <main id="app-content">
            <div id="mundo" class="content-section">
                <h2>Mundo</h2>
                <!-- Content for Mundo -->
            </div>
            <div id="chat" class="content-section" style="display: none;">
                <h2>Chat</h2>
                <!-- Content for Chat -->
            </div>
            <div id="hacer-amigos" class="content-section" style="display: none;">
                <h2>Hacer Amigos</h2>
                <!-- Content for Hacer Amigos -->
            </div>
            <div id="juego" class="content-section" style="display: none;">
                <h2>Juego</h2>
                <!-- Content for Juego -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
