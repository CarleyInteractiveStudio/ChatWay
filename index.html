<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- "Conocer" Screen -->
        <div id="conocer-screen" class="screen active">
            <header>
                <div class="search-bar">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" placeholder="Buscar personas...">
                </div>
            </header>
            <main class="user-list">
                <!-- User profiles will be injected here by JavaScript -->
            </main>
        </div>

        <!-- "Chat" Screen (initially hidden) -->
        <div id="chat-screen" class="screen">
            <header>
                <h2 class="screen-title">Chat</h2>
            </header>
            <main class="conversation-list" id="conversation-list">
                <!-- Conversation items will be injected here by JavaScript -->
            </main>
        </div>

        <!-- "Mundo" Screen (initially hidden) -->
        <div id="mundo-screen" class="screen">
            <header>
                <h2 class="screen-title">Mundo</h2>
            </header>
            <main class="mundo-content">
                <!-- Content for Mundo screen will go here -->
            </main>
        </div>

        <!-- "Game" Screen (initially hidden) -->
        <div id="game-screen" class="screen">
            <header>
                <h2 class="screen-title">Game</h2>
            </header>
            <main class="game-content">
                <!-- Content for Game screen will go here -->
            </main>
        </div>

        <!-- "Perfil" Screen (initially hidden) -->
        <div id="perfil-screen" class="screen">
            <header>
                <h2 class="screen-title">Perfil</h2>
            </header>
            <main class="profile-content">
                <div class="profile-header">
                    <div class="profile-avatar-container">
                        <img src="" alt="Avatar de Perfil" id="profile-avatar">
                        <button class="edit-profile-button">
                            <ion-icon name="pencil-outline"></ion-icon>
                        </button>
                    </div>
                    <h3 id="profile-name"></h3>
                    <p id="profile-bio">¡Hola! Estoy usando ChatWey.</p>
                </div>

                <div class="profile-relationship-card" id="relationship-card">
                    <!-- This will be dynamically filled by JS -->
                </div>

                <div class="profile-actions-list">
                    <a href="#" class="action-item">
                        <ion-icon name="settings-outline"></ion-icon>
                        <span>Ajustes de la cuenta</span>
                    </a>
                    <a href="#" class="action-item">
                        <ion-icon name="notifications-outline"></ion-icon>
                        <span>Notificaciones</span>
                    </a>
                    <a href="#" class="action-item">
                        <ion-icon name="person-add-outline"></ion-icon>
                        <span>Invitar amigos</span>
                    </a>
                    <a href="#" class="action-item logout-button">
                        <ion-icon name="log-out-outline"></ion-icon>
                        <span>Cerrar Sesión</span>
                    </a>
                </div>
            </main>
        </div>

        <!-- "Individual Chat" Screen (initially hidden) -->
        <div id="individual-chat-screen" class="screen">
            <header class="chat-header">
                <button class="back-button" id="back-to-chat-list">
                    <ion-icon name="arrow-back-outline"></ion-icon>
                </button>
                <img src="" alt="Avatar" class="avatar" id="chat-header-avatar">
                <div class="chat-header-info">
                    <h3 id="chat-header-name"></h3>
                    <!-- Optional: status like "online" or "typing..." can go here -->
                </div>
                <div class="chat-options-container">
                    <button class="options-button" id="chat-options-button">
                        <ion-icon name="ellipsis-vertical-outline"></ion-icon>
                    </button>
                    <div class="options-menu" id="chat-options-menu">
                        <a href="#" class="menu-item">Ver perfil</a>
                        <a href="#" class="menu-item">Reportar</a>
                        <a href="#" class="menu-item">Bloquear</a>
                    </div>
                </div>
            </header>
            <main class="message-list" id="message-list">
                <!-- Messages will be injected here by JavaScript -->
            </main>
            <footer class="chat-input-bar">
                <input type="text" placeholder="Escribe un mensaje..." id="message-input">
                <button class="send-message-button">
                    <ion-icon name="send-outline"></ion-icon>
                </button>
            </footer>
        </div>

        <!-- Couple Request Panel (hidden by default) -->
        <div id="couple-request-panel" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <h3>Escribe un mensaje especial</h3>
                <textarea id="couple-request-message" placeholder="Tu mensaje aquí..."></textarea>
                <button id="send-couple-request" class="send-button">Enviar Carta</button>
                <button id="cancel-couple-request" class="cancel-button">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>
        </div>
    </div>

    <!-- Bubble Navigation Menu -->
    <nav class="bubble-nav" id="bubble-nav-bar">
        <a href="#" class="nav-item active" data-screen="conocer-screen">
            <ion-icon name="people-outline"></ion-icon>
            <span>Conocer</span>
        </a>
        <a href="#" class="nav-item" data-screen="chat-screen">
            <ion-icon name="chatbubbles-outline"></ion-icon>
            <span>Chat</span>
        </a>
        <a href="#" class="nav-item" data-screen="mundo-screen">
            <ion-icon name="earth-outline"></ion-icon>
            <span>Mundo</span>
        </a>
        <a href="#" class="nav-item" data-screen="game-screen">
            <ion-icon name="game-controller-outline"></ion-icon>
            <span>Game</span>
        </a>
        <a href="#" class="nav-item" data-screen="perfil-screen">
            <ion-icon name="person-outline"></ion-icon>
            <span>Perfil</span>
        </a>
    </nav>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="app.js"></script>
</body>
</html>
